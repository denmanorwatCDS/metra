env:
  name: "ant"
  normalizer_type: "preset"
  env_kwargs: null
  max_path_length: 200
  frame_stack: null

trainer_args:
  trans_optimization_epochs: 50

replay_buffer:
  common:
    max_transitions: 1000000

rl_algo:
  slot_pooler:
    name: Concat
    kwargs: {}

static_object_extractor:
  type: 'Identity'

skill:
  slot_pooler:
    name: Concat
    kwargs: {}
  trajectory_encoder:
    type: single
    dim_option: ${skill.dim_option}
    net:
      hidden_sizes: ${globals.mlp_arch}
      hidden_nonlinearity: ReLU