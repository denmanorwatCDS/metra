env:
  name: "decoupled_shapes"
  max_path_length: 60
  frame_stack: null
  env_kwargs:
    num_objects_range: [1, 1]
    arena_size: 3

trainer_args:
  trans_optimization_epochs: 120

replay_buffer:
  common:
    max_transitions: 1000000

rl_algo:
  slot_pooler:
    name: Concat
    kwargs: {}

static_object_extractor:
  type: 'Identity'

skill:
  slot_pooler:
    name: Concat
    kwargs: {}
  trajectory_encoder:
    type: single
    dim_option: ${skill.dim_option}
    net:
      hidden_sizes: ${globals.mlp_arch}
      hidden_nonlinearity: ReLU