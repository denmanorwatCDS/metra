env:
  name: "decoupled_shapes"
  normalizer_type: 'shapes'
  max_path_length: ${trainer_args.max_path_length}
  frame_stack: null
  env_kwargs:
    num_objects_range: [1, 1]

trainer_args:
  trans_optimization_epochs: 50
  max_path_length: 80

replay_buffer:
  common:
    max_transitions: 1000000

rl_algo:
  slot_pooler:
    name: Concat
    kwargs: {}

static_object_extractor:
  type: 'Identity'

skill:
  slot_pooler:
    name: Concat
    kwargs: {}
  trajectory_encoder:
    type: single
    dim_option: ${skill.dim_option}
    net:
      hidden_sizes: ${globals.mlp_arch}
      hidden_nonlinearity: ReLU