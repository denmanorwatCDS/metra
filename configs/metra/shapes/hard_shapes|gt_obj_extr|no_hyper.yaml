env:
  name: "decoupled_shapes"
  normalizer_type: 'shapes'
  max_path_length: ${trainer_args.max_path_length}
  frame_stack: null
  env_kwargs:
    num_objects_range: [4, 4]

trainer_args:
  trans_optimization_epochs: 120
  max_path_length: 60

replay_buffer:
  common:
    max_transitions: 1000000

rl_algo:
  slot_pooler:
    name: Transformer
    kwargs: 
      num_layers: 1
      nhead: 4
      dim_feedforward: 192

static_object_extractor:
  type: 'gt'

skill:
  slot_pooler:
    name: Fetcher
    kwargs: {}
  trajectory_encoder:
    type: single
    dim_option: ${skill.dim_option}
    net:
      hidden_sizes: ${globals.mlp_arch}
      hidden_nonlinearity: ReLU